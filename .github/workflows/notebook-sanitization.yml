name: Notebook sanitization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install nbstripout
        run: python -m pip install nbstripout
      - name: Verify notebooks contain no outputs or execution metadata
        run: nbstripout --verify notebooks/*.ipynb
